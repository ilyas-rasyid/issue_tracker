services:
  postgres:
    image: postgres:17-alpine
    ports: ['5433:5432']
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes: ['tracker_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker']
      interval: 5s
      retries: 10
  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ':9001'
    ports: ['9000:9000', '9001:9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ['tracker_storage:/data']
  bucket-init:
    image: pgsty/silo:latest
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command:
      [
        'until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done; mc mb --ignore-existing local/tracker-uploads; exit 0',
      ]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  tracker_pg:
  tracker_storage:

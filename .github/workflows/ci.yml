name: Quality checks
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run check:slop
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
